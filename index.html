<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn What You See</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@pollinations/ui@0.1.0-alpha.20/dist/connect.js"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f3ea; color: #1d2521; }
    main { width: min(100%, 720px); margin: 0 auto; padding: 20px 16px 36px; }
    header { padding: 18px 0 10px; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 10vw, 3.6rem); line-height: .95; letter-spacing: 0; }
    p { line-height: 1.55; }
    .lead { margin: 0; color: #52615a; font-size: 1.05rem; }
    .panel { background: #ffffff; border: 1px solid #ddd6c7; border-radius: 8px; padding: 16px; margin-top: 16px; box-shadow: 0 8px 28px rgba(45, 55, 48, .08); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    label.file { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 16px; border-radius: 8px; background: #14532d; color: white; font-weight: 700; cursor: pointer; }
    input[type=file] { position: absolute; opacity: 0; pointer-events: none; }
    button { min-height: 46px; border: 0; border-radius: 8px; padding: 0 16px; background: #f59e0b; color: #211600; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    img.preview { display: none; width: 100%; max-height: 52vh; object-fit: contain; border-radius: 8px; background: #eef0ea; margin-top: 14px; }
    .status { min-height: 24px; color: #52615a; margin: 12px 0 0; }
    .answer { white-space: pre-wrap; margin: 0; }
    .answer:empty::before { content: "Your explanation will appear here."; color: #7a857f; }
    .small { font-size: .92rem; color: #68756e; }
    select { min-height: 42px; border-radius: 8px; border: 1px solid #cfd6cf; padding: 0 10px; background: white; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Learn What You See</h1>
      <p class="lead">Point your camera at a place, plant, object, sign, or view. The app explains what is in the photo and what to notice next.</p>
    </header>

    <section class="panel" aria-label="Pollinations sign in">
      <div class="row">
        <polli-connect></polli-connect>
        <span class="small">Sign in with Pollinations so explanations use your own balance.</span>
      </div>
    </section>

    <section class="panel" aria-label="Photo explainer">
      <div class="row">
        <label class="file" for="photo">Take or upload photo</label>
        <input id="photo" type="file" accept="image/*" capture="environment">
        <select id="focus" aria-label="Explanation focus">
          <option value="general">General learning</option>
          <option value="nature">Nature and geology</option>
          <option value="history">History and places</option>
          <option value="science">Science</option>
          <option value="language">Words and signs</option>
        </select>
        <button id="analyze" disabled>Explain photo</button>
      </div>
      <img id="preview" class="preview" alt="Selected photo preview">
      <p id="status" class="status">Choose a photo to begin.</p>
    </section>

    <section class="panel" aria-label="Explanation">
      <h2>What you are seeing</h2>
      <p id="answer" class="answer"></p>
    </section>
  </main>

  <script>
    const photoInput = document.querySelector('#photo');
    const preview = document.querySelector('#preview');
    const analyzeButton = document.querySelector('#analyze');
    const statusEl = document.querySelector('#status');
    const answerEl = document.querySelector('#answer');
    const focusEl = document.querySelector('#focus');
    const connectEl = document.querySelector('polli-connect');
    let imageDataUrl = '';

    function setStatus(text) { statusEl.textContent = text; }

    photoInput.addEventListener('change', () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        imageDataUrl = String(reader.result || '');
        preview.src = imageDataUrl;
        preview.style.display = 'block';
        analyzeButton.disabled = false;
        answerEl.textContent = '';
        setStatus('Photo ready. Tap Explain photo.');
      };
      reader.onerror = () => setStatus('Could not read that photo. Try another image.');
      reader.readAsDataURL(file);
    });

    async function explainPhoto() {
      const apiKey = connectEl && connectEl.apiKey;
      if (!apiKey) {
        setStatus('Sign in with Pollinations first, then tap Explain photo again.');
        return;
      }
      if (!imageDataUrl) {
        setStatus('Choose a photo first.');
        return;
      }
      analyzeButton.disabled = true;
      answerEl.textContent = '';
      setStatus('Looking at your photo...');
      const focus = focusEl.value;
      const prompt = `Explain what this photo shows for a curious learner. Focus: ${focus}. Use clear short sections: What it is, Details to notice, Why it matters, and One thing to look for next. If the photo is unclear, say what can and cannot be identified.`;
      try {
        const response = await fetch('https://gen.pollinations.ai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'google/gemini-3.5-flash-lite',
            messages: [{
              role: 'user',
              content: [
                { type: 'text', text: prompt },
                { type: 'image_url', image_url: { url: imageDataUrl } }
              ]
            }],
            max_tokens: 900
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error?.message || `Request failed (${response.status})`);
        }
        const text = data.choices?.[0]?.message?.content || 'No explanation returned. Try another photo.';
        answerEl.textContent = text;
        setStatus('Done. You can choose another photo or change the focus.');
      } catch (error) {
        setStatus(error.message || 'Something went wrong. Try again.');
      } finally {
        analyzeButton.disabled = false;
      }
    }

    analyzeButton.addEventListener('click', explainPhoto);
  </script>
</body>
</html>
